symbolPreset: nerd
theme:
  dark: dark-gruvbox
setupVersion: 2
modelRoles:
  default: openai-codex/gpt-5.6-sol
  smol: openai-codex/gpt-5.6-luna
  slow: openai-codex/gpt-5.6-sol
  vision: openai-codex/gpt-5.6-sol
  plan: openai-codex/gpt-5.6-sol
  designer: openai-codex/gpt-5.6-sol
  commit: openai-codex/gpt-5.6-luna
  task: openai-codex/gpt-5.6-sol
  advisor: openai-codex/gpt-5.6-sol
  tiny: openai-codex/codex-auto-review
browser:
  headless: true
defaultThinkingLevel: auto
dev:
  autoqaConsent: granted
textVerbosity: low
bash:
  autoBackground:
    enabled: true
astGrep:
  enabled: true
github:
  enabled: true
task:
  enableEffort: false
  enableLsp: true
  eager: default
  batch: true
  softRequestBudget: 200
personality: default
tui:
  tight: true
display:
  shimmer: disabled
  smoothStreaming: true
statusLine:
  preset: custom
  separator: ascii
  sessionAccent: true
  leftSegments:
    - model
    - mode
    - collab
    - path
    - git
    - pr
  rightSegments:
    - session_name
    - context_pct
  segmentOptions:
    path:
      maxLength: 25
      stripWorkPrefix: true
      abbreviate: true
startup:
  quiet: true
hideThinkingBlock: true
composer:
  shape: pi
